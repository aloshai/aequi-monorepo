services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: aequi-server-${STACK_SUFFIX:-prod}
    expose:
      - "3000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - dokploy-network
      - outbound
    labels:
      - "traefik.enable=true"
      # Router name includes ${STACK_SUFFIX:-prod} so multiple environments
      # (production + staging) can coexist on the same Traefik instance
      # without colliding on router name.
      - "traefik.http.routers.aequi-api-${STACK_SUFFIX:-prod}.rule=Host(`${API_DOMAIN:-api.yourdomain.com}`)"
      - "traefik.http.routers.aequi-api-${STACK_SUFFIX:-prod}.entrypoints=websecure"
      - "traefik.http.routers.aequi-api-${STACK_SUFFIX:-prod}.tls=true"
      - "traefik.http.routers.aequi-api-${STACK_SUFFIX:-prod}.service=aequi-api-${STACK_SUFFIX:-prod}"
      - "traefik.http.services.aequi-api-${STACK_SUFFIX:-prod}.loadbalancer.server.port=3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_BASE_URL=${API_URL:-https://api.yourdomain.com}
    container_name: aequi-web-${STACK_SUFFIX:-prod}
    expose:
      - "80"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aequi-web-${STACK_SUFFIX:-prod}.rule=Host(`${WEB_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.aequi-web-${STACK_SUFFIX:-prod}.entrypoints=websecure"
      - "traefik.http.routers.aequi-web-${STACK_SUFFIX:-prod}.tls=true"
      - "traefik.http.routers.aequi-web-${STACK_SUFFIX:-prod}.service=aequi-web-${STACK_SUFFIX:-prod}"
      - "traefik.http.services.aequi-web-${STACK_SUFFIX:-prod}.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
  outbound:
    driver: bridge
